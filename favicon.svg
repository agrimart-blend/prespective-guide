<svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1000"><g clip-path="url(#SvgjsClipPath1936)"><rect width="1000" height="1000" fill="#8fcac4"></rect><g transform="matrix(8,0,0,8,100,100)"><svg xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle (brand blue) -->
  <circle cx="50" cy="50" r="50" fill="#9AC7D9"></circle>

  <!-- subtle inner glow ring for depth -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#EBF1F2" stroke-opacity="0.12" stroke-width="2"></circle>

  <!-- horizon line -->
  <rect x="10" y="46" width="80" height="8" rx="4" fill="#FFFFFF"></rect>

  <!-- converging perspective lines to vanishing point -->
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-width="6" stroke-linejoin="round">
    <!-- left-top -->
    <line x1="12" y1="18" x2="50" y2="50"></line>
    <!-- right-top -->
    <line x1="88" y1="18" x2="50" y2="50"></line>
    <!-- bottom -->
    <line x1="50" y1="88" x2="50" y2="50"></line>
  </g>

  <!-- small vanishing point center -->
  <circle cx="50" cy="50" r="5" fill="#0F4856"></circle>
</svg></svg></g></g><defs><clipPath id="SvgjsClipPath1936"><rect width="1000" height="1000" x="0" y="0" rx="250" ry="250"></rect></clipPath></defs></svg>